name: Security Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# NOTE: CodeQL code scanning needs GitHub Advanced Security on private
# repositories, so it is intentionally not enabled here. The security stack is:
# Dependabot alerts (enabled) + the dependency-graph submission below + the
# weekly grouped Dependabot updates from .github/dependabot.yml.
jobs:
  dependency-submission:
    name: Submit Dependency Graph
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Generate and submit the Gradle dependency graph
        uses: gradle/actions/dependency-submission@v6