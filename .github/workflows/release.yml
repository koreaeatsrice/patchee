name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer bump type (auto detects breaking/feat/fix from Conventional Commits)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (simulate release notes & version bump without committing, tagging, or publishing)"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release & Generate Notes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.engine.outputs.tag }}
      version: ${{ steps.engine.outputs.version }}
      dry_run: ${{ steps.engine.outputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run Release Engine
        id: engine
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git config user.name "uriel-runner[bot]"
            git config user.email "uriel-runner[bot]@users.noreply.github.com"
            DRY_RUN_ARG=""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              DRY_RUN_ARG="--dry-run"
            fi
            python .github/scripts/release.py --bump "${{ inputs.bump }}" $DRY_RUN_ARG --repo "${{ github.repository }}"
          else
            python .github/scripts/release.py --current-tag "${{ github.ref_name }}" --repo "${{ github.repository }}"
          fi

      - name: Upload Release Notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  build-release:
    name: Build Release Jar
    needs: prepare
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload release jar
        uses: actions/upload-artifact@v7
        with:
          name: release-jar
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  publish:
    name: Publish GitHub Release (draft)
    needs: [ prepare, build-release ]
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" \
            release-assets/*.jar \
            --repo "${{ github.repository }}" \
            --title "${{ needs.prepare.outputs.tag }}" \
            --notes-file release-assets/RELEASE_NOTES.md \
            --draft \
            --verify-tag